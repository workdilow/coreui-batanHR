version: "3.9"

services:
  app:
    image: mcr.microsoft.com/devcontainers/php:8.2
    volumes:
      - ..:/workspace
    command: sleep infinity
    depends_on:
      - db

  db:
    image: postgres:15
    environment:
      POSTGRES_DB: epc_erp
      POSTGRES_USER: erp
      POSTGRES_PASSWORD: erp
    ports:
      - "5432:5432"
